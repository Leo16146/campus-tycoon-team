# Runs the test suite on every push and pull request.
# No secrets are used. Actions are pinned to full commit SHAs.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install Python 3.12 and the locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest
