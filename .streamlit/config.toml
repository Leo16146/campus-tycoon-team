# Look of the app. No secrets belong here (.streamlit/secrets.toml is git-ignored).

[client]
# Visitors only see the viewer menu, not the developer tools.
toolbarMode = "viewer"

[theme]
base = "light"
# Warm coffee colours; every text/background pair has a contrast of at least 6:1.
primaryColor = "#9A4A12"
backgroundColor = "#FFFBF5"
secondaryBackgroundColor = "#F6EEE4"
textColor = "#2B2118"
borderColor = "#E6D9C9"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontWeight = 650
